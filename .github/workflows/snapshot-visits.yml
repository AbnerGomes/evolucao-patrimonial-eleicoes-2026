name: Snapshot do contador de acessos

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 06:00 UTC (~03:00 em Brasília)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Buscar contagem atual e salvar snapshot
        run: python3 scripts/snapshot_visits.py

      - name: Commitar snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visit_history.json
          git diff --cached --quiet || git commit -m "Snapshot diário do contador de acessos"
          git push
